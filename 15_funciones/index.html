<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prueba e interactúa con 15 funciones sencillas de JavaScript.">
    <title>Panel interactivo de funciones JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> 15 funciones</h1>
    </header>

    <main>
        <section aria-label="Funciones disponibles">
            <div id="contenedor-funciones" class="grid-container"></div>
        </section>

        <section id="area-resultados" class="result-box hidden" aria-labelledby="titulo-resultado">
            <div class="result-header">
                <h2 id="titulo-resultado">Resultado</h2>
                <button type="button" onclick="cerrarResultado()" class="btn-cerrar" aria-label="Cerrar resultado">×</button>
            </div>
            <div id="output-texto" aria-live="polite"></div>
        </section>
    </main>

    <script src="15_funcions.js"></script>
    <script src="app.js"></script>
</body>
</html>
